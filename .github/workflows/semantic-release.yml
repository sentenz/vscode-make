name: Semantic-Release

on:
  push:
    branches:
      - main
      - next
      - beta
      - alpha

jobs:
  semantic-release:
    name: Semantic-Release Action
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      new-release-version: ${{ steps.release.outputs.new-release-version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run Semantic Release
        id: release
        uses: sentenz/actions/semantic-release@c1455a61876aefd9852bf4a5c60273bd8b821070 # 1.2.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          semantic-version: "25.0.3"
          extra-plugins: |
            @semantic-release/changelog@^6
            @semantic-release/git@^10
            conventional-changelog-conventionalcommits@9.3.1

      - name: Run SBOM Generation (CycloneDX)
        if: steps.release.outputs.new-release-published == 'true'
        uses: sentenz/actions/trivy@c1455a61876aefd9852bf4a5c60273bd8b821070 # 1.2.3
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: cyclonedx
          output: sbom.cdx.json

      - name: Run SBOM Generation (SPDX)
        if: steps.release.outputs.new-release-published == 'true'
        uses: sentenz/actions/trivy@c1455a61876aefd9852bf4a5c60273bd8b821070 # 1.2.3
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: spdx-json
          output: sbom.spdx.json

      - name: Publish SBOM artifacts
        if: steps.release.outputs.new-release-published == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.new-release-version }}
          files: |
            sbom.cdx.json
            sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vscode-extension:
    name: VS Code Extension Action
    needs: semantic-release
    if: needs.semantic-release.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.new-release-version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Set Extension Version
        env:
          RELEASE_VERSION: ${{ needs.semantic-release.outputs.new-release-version }}
        run: |
          set -euo pipefail

          extension_version="${RELEASE_VERSION#v}"
          npm version "${extension_version}" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: npm ci

      - name: Run VS Code Extension
        id: extension
        uses: sentenz/actions/vscode-extension@e4601d50d84e629bcad4401c4d6937e3178c3000 # 1.3.0
        with:
          marketplace-token: ${{ secrets.VSCE_PAT }}
          output-path: "out/extension.vsix"
          vsce-version: "3.9.2"
          no-dependencies: "true"

      - name: Publish VSIX Artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.semantic-release.outputs.new-release-version }}
          files: "out/extension.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        env:
          EXTENSION_ID: ${{ steps.extension.outputs.extension-id }}
          EXTENSION_VERSION: ${{ steps.extension.outputs.version }}
          VSIX_PATH: ${{ steps.extension.outputs.vsix-path }}
        run: |
          {
            echo "## VS Code Extension Published"
            echo
            echo "- Extension: ${EXTENSION_ID}"
            echo "- Version: ${EXTENSION_VERSION}"
            echo "- VSIX: ${VSIX_PATH}"
          } >> "${GITHUB_STEP_SUMMARY}"
