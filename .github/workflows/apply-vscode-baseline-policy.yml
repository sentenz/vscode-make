# SPDX-License-Identifier: Apache-2.0

name: Apply VS Code Baseline Policy

on:
  push:
    branches:
      - agent/renovate-vscode-baseline

permissions:
  contents: write

jobs:
  apply:
    name: Apply repository policy changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/renovate-vscode-baseline

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Apply policy changes
        shell: bash
        run: |
          mkdir -p scripts
          cat > scripts/check-vscode-api-baseline.mjs <<'EOF'
          import { readFile } from "node:fs/promises";

          const root = new URL("../", import.meta.url);
          const [packageJson, packageLock] = await Promise.all([
            readFile(new URL("package.json", root), "utf8").then(JSON.parse),
            readFile(new URL("package-lock.json", root), "utf8").then(JSON.parse),
          ]);

          const engineVersion = packageJson.engines?.vscode;
          const typesVersion = packageJson.devDependencies?.["@types/vscode"];
          const lockRoot = packageLock.packages?.[""];
          const problems = [];

          if (engineVersion !== `^${typesVersion}`) {
            problems.push(
              `package.json engines.vscode (${engineVersion}) must equal ^${typesVersion}`,
            );
          }

          if (lockRoot?.engines?.vscode !== engineVersion) {
            problems.push(
              `package-lock.json engines.vscode (${lockRoot?.engines?.vscode}) must equal ${engineVersion}`,
            );
          }

          if (lockRoot?.devDependencies?.["@types/vscode"] !== typesVersion) {
            problems.push(
              `package-lock.json @types/vscode (${lockRoot?.devDependencies?.["@types/vscode"]}) must equal ${typesVersion}`,
            );
          }

          if (problems.length > 0) {
            throw new Error(`VS Code API baseline mismatch:\n- ${problems.join("\n- ")}`);
          }

          console.log(`VS Code API baseline is aligned at ${typesVersion}.`);
          EOF

          node <<'NODE'
          const fs = require("node:fs");

          const readJson = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const writeJson = (path, value) =>
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);

          const packageJson = readJson("package.json");
          const baselineCheck = "npm run check:vscode-api-baseline";
          const existingChecks = packageJson.scripts.check
            .split(" && ")
            .filter((command) => command !== baselineCheck);
          packageJson.scripts["check:vscode-api-baseline"] =
            "node scripts/check-vscode-api-baseline.mjs";
          packageJson.scripts.check = [baselineCheck, ...existingChecks].join(" && ");
          writeJson("package.json", packageJson);

          const packageLock = readJson("package-lock.json");
          const lockRoot = packageLock.packages[""];
          lockRoot.engines.vscode = packageJson.engines.vscode;
          lockRoot.devDependencies["@types/vscode"] =
            packageJson.devDependencies["@types/vscode"];
          writeJson("package-lock.json", packageLock);

          const renovate = readJson("renovate.jsonc");
          const npmRuleIndex = renovate.packageRules.findIndex(
            (rule) => rule.groupSlug === "npm-dependencies",
          );
          if (npmRuleIndex < 0) {
            throw new Error("Unable to find the npm dependencies package rule.");
          }

          renovate.packageRules[npmRuleIndex].matchFileNames = ["package.json"];

          const policyDescription =
            "Manage the VS Code API compatibility baseline manually.";
          renovate.packageRules = renovate.packageRules.filter(
            (rule) => rule.description !== policyDescription,
          );
          renovate.packageRules.splice(npmRuleIndex + 1, 0, {
            description: policyDescription,
            matchManagers: ["npm"],
            matchDepNames: ["vscode", "@types/vscode"],
            enabled: false,
          });
          writeJson("renovate.jsonc", renovate);
          NODE

      - name: Validate changes
        run: |
          node scripts/check-vscode-api-baseline.mjs
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json renovate.jsonc scripts/check-vscode-api-baseline.mjs
          git commit -m "fix: enforce VS Code API baseline"
          git push origin HEAD:agent/renovate-vscode-baseline
