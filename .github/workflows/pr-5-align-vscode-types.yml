name: Apply PR 5 VS Code typings fix

on:
  push:
    branches:
      - renovate/minor-versions
    paths:
      - .github/workflows/pr-5-align-vscode-types.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: renovate/minor-versions
          fetch-depth: 0

      - name: Align VS Code typings with engine floor
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'package.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.devDependencies['@types/vscode'] = '1.100.0';
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.packages[''].devDependencies['@types/vscode'] = '1.100.0';
          lock.packages['node_modules/@types/vscode'] = {
            version: '1.100.0',
            resolved: 'https://registry.npmjs.org/@types/vscode/-/vscode-1.100.0.tgz',
            integrity: 'sha512-4uNyvzHoraXEeCamR3+fzcBlh7Afs4Ifjs4epINyUX/jvdk0uzLnwiDY35UKDKnkCHP5Nu3dljl2H8lR6s+rQw==',
            dev: true
          };
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm --force .github/workflows/pr-5-align-vscode-types.yml
          git diff --cached --check
          git commit -m "fix(deps): align VS Code typings with engine"
          git push origin HEAD:renovate/minor-versions
