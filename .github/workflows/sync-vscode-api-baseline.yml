name: Sync VS Code API Baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/align-vscode-api-baseline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Synchronize Lockfile Metadata
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          packageLock.packages[""].engines = packageJson.engines;
          fs.writeFileSync("package-lock.json", `${JSON.stringify(packageLock, null, 2)}\n`);
          NODE

      - name: Commit Lockfile Metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "sync package lock metadata"
            git push
          fi
