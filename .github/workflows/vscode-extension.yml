name: VS Code Extension

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      publish:
        description: Publish the VS Code extension to Visual Studio Marketplace
        required: true
        type: boolean
      version:
        description: VS Code extension version and Git tag to publish
        required: true
        type: string
    secrets:
      VSCE_PAT:
        description: Visual Studio Marketplace access token
        required: true

permissions:
  contents: read

jobs:
  build:
    name: VS Code Extension Action - Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run VS Code Extension
        id: extension
        uses: sentenz/actions/vscode-extension@e4601d50d84e629bcad4401c4d6937e3178c3000 # 1.3.0
        with:
          output-path: "out/extension.vsix"
          vsce-version: "3.9.2"
          no-dependencies: "true"
          publish: "false"

      - name: Validate VS Code Extension
        env:
          EXTENSION_ID: ${{ steps.extension.outputs.extension-id }}
          EXTENSION_VERSION: ${{ steps.extension.outputs.version }}
          PUBLISHED: ${{ steps.extension.outputs.published }}
          VSIX_PATH: ${{ steps.extension.outputs.vsix-path }}
        run: |
          set -euo pipefail

          expected_version="$(node -p "require('./package.json').version")"

          [[ "${EXTENSION_ID}" == "sentenz.makefile-task-explorer" ]]
          [[ "${EXTENSION_VERSION}" == "${expected_version}" ]]
          [[ "${PUBLISHED}" == "false" ]]
          [[ -s "${VSIX_PATH}" ]]

          unzip -Z1 "${VSIX_PATH}" | grep -Fx "extension/package.json"

  publish:
    name: VS Code Extension Action - Publish
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Set Extension Version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          extension_version="${RELEASE_VERSION#v}"
          npm version "${extension_version}" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: npm ci

      - name: Run VS Code Extension
        id: extension
        uses: sentenz/actions/vscode-extension@e4601d50d84e629bcad4401c4d6937e3178c3000 # 1.3.0
        with:
          marketplace-token: ${{ secrets.VSCE_PAT }}
          output-path: "out/extension.vsix"
          vsce-version: "3.9.2"
          no-dependencies: "true"
          publish: ${{ inputs.publish }}

      - name: Publish VSIX Artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          files: "out/extension.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        env:
          EXTENSION_ID: ${{ steps.extension.outputs.extension-id }}
          EXTENSION_VERSION: ${{ steps.extension.outputs.version }}
          VSIX_PATH: ${{ steps.extension.outputs.vsix-path }}
        run: |
          {
            echo "## VS Code Extension Published"
            echo
            echo "- Extension: ${EXTENSION_ID}"
            echo "- Version: ${EXTENSION_VERSION}"
            echo "- VSIX: ${VSIX_PATH}"
          } >> "${GITHUB_STEP_SUMMARY}"
