# SPDX-License-Identifier: Apache-2.0

name: VS Code Extension

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: VS Code extension version and Git tag to publish
        required: true
        type: string
    secrets:
      VSCE_PAT:
        description: Visual Studio Marketplace access token
        required: true

permissions:
  contents: read

jobs:
  build:
    name: VS Code Extension Action - Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run VS Code Extension
        uses: sentenz/actions/vscode-extension@e4601d50d84e629bcad4401c4d6937e3178c3000 # 1.3.0
        with:
          output-path: "out/extension.vsix"
          vsce-version: "3.9.2"
          no-dependencies: "true"
          publish: "false"

  publish:
    name: VS Code Extension Action - Publish
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Set Extension Version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          extension_version="${RELEASE_VERSION#v}"
          npm version "${extension_version}" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: npm ci

      - name: Run VS Code Extension
        uses: sentenz/actions/vscode-extension@e4601d50d84e629bcad4401c4d6937e3178c3000 # 1.3.0
        with:
          marketplace-token: ${{ secrets.VSCE_PAT }}
          output-path: "out/extension.vsix"
          vsce-version: "3.9.2"
          no-dependencies: "true"
          publish: "true"

      - name: Publish VSIX Artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          files: "out/extension.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
