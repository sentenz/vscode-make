# SPDX-License-Identifier: Apache-2.0

name: VS Code Extension Release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Build, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build extension
        run: make vscode-extension-build

      - name: Package extension
        run: make vscode-extension-package

      - name: Publish extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: make vscode-extension-publish

      - name: Upload VSIX
        if: always() && hashFiles('out/extension.vsix') != ''
        uses: actions/upload-artifact@v4
        with:
          name: makefile-task-explorer-vsix
          path: out/extension.vsix
          if-no-files-found: error
